name: Debug signing secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "size=$(stat -c%s "$RUNNER_TEMP/release.keystore")"
          echo "b64_len=${#KEYSTORE_BASE64}"

      - name: Verify passwords
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "store_len=${#KEYSTORE_PASSWORD} key_len=${#KEY_PASSWORD} alias=${KEY_ALIAS}"
          if keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "STORE_PASSWORD_OK"
          else
            echo "STORE_PASSWORD_FAIL"
          fi
          if keytool -keypasswd -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -new "$KEY_PASSWORD" >/dev/null 2>&1; then
            echo "KEY_PASSWORD_OK"
          else
            echo "KEY_PASSWORD_FAIL"
          fi
