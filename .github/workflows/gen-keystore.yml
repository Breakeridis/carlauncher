name: Gen signing keystore

# One-off job: generates the permanent release keystore with random
# passwords and uploads it (keystore + properties) as a workflow artifact.
# Artifacts are only downloadable by repo members. Run once, download,
# set the repo secrets, then delete this workflow file.

on:
  workflow_dispatch:

jobs:
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          SP=$(openssl rand -base64 24)
          KP=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias carlauncher \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$SP" -keypass "$KP" \
            -dname "CN=Carlauncher, O=Carlauncher, C=US"
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=carlauncher\nkeyPassword=%s\n' "$SP" "$KP" > keystore.properties
          zip -q keystore-bundle.zip release.keystore keystore.properties
          rm release.keystore keystore.properties

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: keystore-bundle.zip
          if-no-files-found: error
          retention-days: 1
